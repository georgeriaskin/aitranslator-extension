<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Translator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>AI Translator</h1>
        
        <!-- API Key Section -->
        <section class="section">
            <h2>API Key</h2>
            <input type="password" id="apiKey" placeholder="Enter OpenRouter API Key">
            <button id="saveApiKey">Save Key</button>
        </section>
        
        <!-- Model Section -->
        <section class="section">
            <h2>Model</h2>
            <select id="modelSelect">
                <option value="openai/gpt-3.5-turbo">GPT-3.5 Turbo</option>
                <option value="anthropic/claude-3-haiku">Claude 3 Haiku</option>
            </select>
            <input type="text" id="newModel" placeholder="Add new model (e.g., deepseek/deepseek-chat-v3.1:free)">
            <button id="addModel">Add Model</button>
        </section>
        
        <!-- Languages Section -->
        <section class="section">
            <h2>Languages</h2>
            <div class="lang-select">
                <label for="sourceLang">From:</label>
                <select id="sourceLang">
                    <option value="Russian">Russian</option>
                    <option value="English">English</option>
                </select>
            </div>
            <div class="lang-select">
                <label for="targetLang">To:</label>
                <select id="targetLang">
                    <option value="English">English</option>
                    <option value="Russian">Russian</option>
                </select>
            </div>
        </section>
        
        <!-- Input Section -->
        <section class="section">
            <h2>Input Text</h2>
            <textarea id="inputText" placeholder="Enter text to translate..." rows="6"></textarea>
        </section>
        
        <!-- Translate Button -->
        <button id="translateBtn" class="translate-btn">Translate</button>
        
        <!-- Output Section -->
        <section class="section">
            <h2>Translated Text</h2>
            <textarea id="outputText" placeholder="Translation will appear here..." rows="6" readonly></textarea>
        </section>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
