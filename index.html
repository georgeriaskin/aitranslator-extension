<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Translator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>AI Translator</h1>
        
        <!-- Header with Languages and Settings Gear -->
        <header class="header">
            <div class="lang-controls">
                <select id="sourceLang">
                    <option value="Automatic">Automatic</option>
                    <option value="Russian">Russian</option>
                    <option value="English">English</option>
                </select>
                <select id="targetLang">
                    <option value="English">English</option>
                    <option value="Russian">Russian</option>
                </select>
            </div>
            <div id="settingsGear" class="gear-icon">⚙</div>
        </header>
        
        <!-- Input Section -->
        <section class="input-section">
            <textarea id="inputText" placeholder="Type to translate" rows="6"></textarea>
            <span id="inputCharCount" class="char-count">0 characters</span>
        </section>
        
        <!-- Translate Button -->
        <button id="translateBtn" class="translate-btn">Translate</button>
        
        <!-- Output Section -->
        <section class="output-section">
            <textarea id="outputText" placeholder="The translation will appear here" rows="6" readonly></textarea>
            <span id="outputCharCount" class="char-count">0 characters</span>
        </section>
        
        <!-- Settings Modal -->
        <div id="settingsModal" class="modal">
            <div class="modal-overlay" id="modalOverlay"></div>
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Settings</h2>
                    <span id="closeModal" class="close">&times;</span>
                </div>
                
                <!-- Model Section -->
                <section class="section">
                    <h3>Model</h3>
                    <select id="modelSelect">
                        <option value="deepseek/deepseek-chat-v3.1:free">DeepSeek V3.1 (Free)</option>
                        <option value="openai/gpt-3.5-turbo">GPT-3.5 Turbo</option>
                        <option value="anthropic/claude-3-haiku">Claude 3 Haiku</option>
                    </select>
                    <input type="text" id="newModel" placeholder="Add new model (e.g., deepseek/deepseek-chat-v3.1:free)">
                    <button id="addModel">Add Model</button>
                </section>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
